name: Toolkit checks
on:
  push:
    branches: ["codex/**", "claude/**", "main"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional readers and schema engine
        run: python -m pip install -r requirements-pdf.txt jsonschema==4.25.1
      - name: Mutation checks with both schema engines
        run: |
          python bs.py check --selftest
          python bs.py check --selftest --builtin
      - name: Evidence and routing regressions
        run: python -m unittest discover -s tests -v
      - name: Build synthetic examples and menu
        run: |
          python bs.py build examples
          python scripts/build_workspace_menu.py examples
          python scripts/source_design.py check --site http://127.0.0.1:4899 --local-source-app --css design-system/workspace/source-tokens.css
