<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{title}}</title>
<style>
{{css}}
/* ---------- the two views: a quiet switch ---------- */
.views{display:flex;gap:28px;margin-top:26px;border-bottom:1px solid var(--line)}
.views button{position:relative;padding:0 0 10px;border:0;background:none;font-size:14px;color:var(--muted);cursor:pointer}
.views button:hover{color:var(--ink)}
.views button[aria-selected="true"]{color:var(--ink);font-weight:600}
.views button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.view>.toc:first-child{margin-top:0;border-top:0}
.view[hidden]{display:none}

/* ---------- the Folder view ---------- */
#folder-view{
  --w-kind:128px;--w-st:124px;--w-rec:76px;--w-sz:72px;--w-dt:108px;--w-use:112px;
  --gut:20px;--gap:16px;
}
.m{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.strip{padding:11px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);overflow:hidden}
/* every group carries its own hairline divider on its left. The groups are pulled 37px left and the strip clips
   there, so the first group of each line, wrapped or not, shows no divider: no line ever starts on one. */
.strip-i{display:flex;flex-wrap:wrap;align-items:center;gap:8px 0;margin-left:-37px}
.sg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-left:18px;padding-left:18px;border-left:1px solid var(--line-strong)}
.si{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.si b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.mk{display:inline-block;width:9px;height:9px;border-radius:var(--radius);flex:none;border:1px solid transparent}
.mk.converted{background:var(--flow)}
.mk.unchecked{background:var(--peach);border-color:var(--soft)}
.mk.not-converted{background:var(--paper);border:1.5px solid var(--accent)}
.mk.duplicate{background:var(--paper);border-color:var(--soft)}
.mk.error{background:var(--accent)}

/* next steps: one slim line */
.todo{display:flex;align-items:baseline;margin:24px 0 0;padding:1px 0 1px 12px;border-left:2px solid var(--accent);font-size:13px;line-height:1.5}
.todo[hidden],.miss[hidden]{display:none}
.todo-h{flex:none;margin-right:14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
/* every item carries its own leading "·". The list is pulled 24px left and clipped there, so the first item of
   each line, wrapped or not, shows no separator and no line ever starts or ends on one. */
.todo-w{min-width:0;clip-path:inset(-6px -6px -6px -6px)}
.todo-i{display:flex;flex-wrap:wrap;row-gap:2px;margin-left:-24px}
.todo .ti{white-space:nowrap}
.todo .ti::before{content:"·";content:"·"/"";display:inline-block;width:24px;text-align:center;color:var(--muted)}
.todo a{text-decoration-color:var(--line-strong)}
.miss{margin:10px 0 0;padding-left:14px;font-size:13px;color:var(--accent-ink)}

/* the card: toolbar and table */
.card{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
.toolbar{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px 0 var(--gut);border-bottom:1px solid var(--line)}
.seg-wrap{display:flex;align-items:center;gap:10px}
.seg-label{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;padding:2px;background:var(--panel);border-radius:var(--radius)}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:block;padding:4px 11px;border-radius:var(--radius);font-size:12.5px;color:var(--muted);white-space:nowrap;border:1px solid transparent}
.seg input:checked+span{background:var(--paper);color:var(--ink);border-color:var(--line-strong);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:1px}
.search{position:relative;flex:1;min-width:0;max-width:300px;margin-left:auto}
.search .ic{position:absolute;left:9px;top:50%;margin-top:-7px;pointer-events:none}
.search input{width:100%;height:30px;padding:0 30px 0 29px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper);font-size:13px}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search input:focus-visible{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.clr{position:absolute;right:3px;top:50%;margin-top:-12px;display:grid;place-items:center;width:24px;height:24px;padding:0;border:0;border-radius:var(--radius);background:none;cursor:pointer}
.clr:hover{background:var(--bg)}
.clr[hidden]{display:none}
.tools{display:flex;gap:2px}
.ibtn{display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid transparent;border-radius:var(--radius);background:transparent;cursor:pointer}
.ibtn:hover{background:var(--bg);border-color:var(--line)}

.tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.tbl col.k{width:calc(var(--w-kind) + var(--gap))}
.tbl col.s{width:calc(var(--w-st) + var(--gap))}
.tbl col.rc{width:calc(var(--w-rec) + var(--gap))}
.tbl col.z{width:calc(var(--w-sz) + var(--gap))}
.tbl col.d{width:calc(var(--w-dt) + var(--gap))}
.tbl col.u{width:calc(var(--w-use) + var(--gut))}
.tbl th,.tbl td{padding:0 var(--gap) 0 0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl th:first-child,.tbl td:first-child{padding-left:var(--gut)}
.tbl th:last-child,.tbl td:last-child{padding-right:var(--gut)}
.tbl th{height:34px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);vertical-align:middle}
.tbl td{height:38px;vertical-align:middle;font-size:12.5px}
.tbl .r{text-align:right}
.tbl .num{font-variant-numeric:tabular-nums;color:var(--muted)}
.tbl tbody tr:first-child>td{height:44px;padding-top:6px}
.tbl tbody tr:last-child>td{height:46px;padding-bottom:8px}
.tbl tbody tr.peek:last-child>td{height:auto;padding-bottom:16px}
.tbl tr.dir,.tbl tr.file{cursor:pointer}
.tbl tr.dir:hover td,.tbl tr.file:hover td,.tbl tr.file.open td,.tbl tr.peek td{background:var(--bg)}

.nmw{display:flex;align-items:center;gap:8px;min-width:0;padding-left:calc(var(--lvl,0)*var(--indent))}
.nb{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.nb:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:1px}
.nb .chev .ic{transition:transform .12s,opacity .12s}
.nb[aria-expanded="true"] .chev .ic{transform:rotate(90deg)}
.file .chev .ic{opacity:0}
.file:hover .chev .ic,.file.open .chev .ic,.file .nb:focus-visible .chev .ic{opacity:1}
.fv-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.dir .fv-nm{font-weight:600}
.cnt{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kd{color:var(--muted)}
mark{background:var(--lane-alt);color:inherit;border-radius:1px;box-shadow:0 0 0 1px var(--lane-alt)}
.rid{font-weight:600;font-variant-numeric:tabular-nums;text-decoration:none}
.rid:hover{text-decoration:underline;text-decoration-color:var(--ink)}
.used b{color:var(--ink);font-weight:600}

/* the one quiet line under an opened file: the record's own header, never its text */
.tbl tr.peek td{height:auto;padding-bottom:12px;vertical-align:top;font-size:12.5px;color:var(--muted);white-space:normal}
.pk{padding-left:calc(var(--lvl,0)*var(--indent) + 40px);white-space:normal;overflow-wrap:anywhere}
.pk b{color:var(--ink);font-weight:600}
.pk-r{white-space:normal}
.pk-r .ic{width:12px;height:12px;vertical-align:-1px;margin:0 3px 0 6px;stroke:var(--flow)}
.pk code,.pk-r code{color:var(--ink)}
.lbl{margin-right:6px;font-size:11px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--radius);border:1px solid transparent;font-size:11.5px;font-weight:600;line-height:1;white-space:nowrap}
.chip.converted{background:var(--panel);color:var(--ink)}
.chip.unchecked{background:var(--peach);color:var(--ink)}
.chip.not-converted{background:var(--paper);color:var(--accent-ink);border-color:var(--accent)}
.chip.duplicate{background:var(--paper);color:var(--muted);border-color:var(--line-strong)}
.chip.error{background:var(--accent);color:var(--ink)}

/* landing on a row: the shared 2px accent rule and fade */
.tbl tr:target>td,.tbl tr:has(>td:target)>td,.tbl tr.flash>td{animation:land-bg 2.6s ease-out}
.tbl tr:target>td:first-child,.tbl tr:has(>td:target)>td:first-child,.tbl tr.flash>td:first-child{animation-name:land-rule}
.fi:target,.fi:has(>:target),.fi.flash{animation:land-rule 2.6s ease-out}
@media (prefers-reduced-motion:reduce){
  .tbl tr:target>td,.tbl tr:has(>td:target)>td,.tbl tr.flash>td,.fi:target,.fi:has(>:target),.fi.flash{animation-timing-function:step-end}
  .nb .chev .ic{transition:none}
}

.empty{padding:28px var(--gut);color:var(--muted);font-size:13px}
.empty[hidden]{display:none}
.empty button{margin-left:6px;padding:0;border:0;background:none;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink)}
.card-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:40px;padding:0 var(--gut);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend .lg{gap:8px}

.foot-note{overflow-wrap:anywhere;margin-top:44px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot-note code{font-size:11.5px;white-space:nowrap}

/* phone list */
.flat{display:none;list-style:none;margin:0;padding:0}
.flat ul{list-style:none;margin:0;padding:0}
.fg-h{display:flex;align-items:center;gap:8px;margin:0;padding:16px 16px 6px;font:600 12px/1.3 var(--mono);color:var(--muted)}
.fg-h>span:not(.n){min-width:0;overflow-wrap:anywhere}
.fg-h .n{margin-left:auto;font-family:var(--sans);font-weight:400;font-variant-numeric:tabular-nums}
.fi{padding:11px 16px 12px;border-top:1px solid var(--line)}
.fi-nm{display:grid;grid-template-columns:14px minmax(0,1fr);column-gap:10px;align-items:start;font-size:14px}
.fi-nm .ic{margin-top:3px}
.fi-nm>span{overflow-wrap:anywhere}
.fi-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:6px 0 0 24px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.print-only{display:none}

@media screen and (max-width:1180px){
  #folder-view{--w-kind:108px;--w-st:112px;--w-rec:60px;--w-sz:60px;--w-dt:96px;--w-use:96px;--gut:16px;--gap:12px}
  .toolbar{gap:10px}
  .seg-label{display:none}
}
@media screen and (max-width:900px){
  .views{margin-top:20px}
  .strip{padding:12px 0}
  .strip-i{display:grid;gap:8px;margin-left:0}
  .sg{gap:6px 14px;margin-left:0;padding-left:0;border-left:0}
  .todo{margin-top:20px}
  .toolbar{flex-wrap:wrap;height:auto;padding:12px 16px;gap:10px}
  .seg-wrap{width:100%}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
  .seg span{text-align:center;padding:6px 4px}
  .search{max-width:none;margin-left:0;flex:1 1 100%}
  .search input{height:36px;font-size:16px}
  .tools,.tbl,.card-foot .hintk{display:none}
  .flat{display:block}
  .card-foot{padding:0 16px}
  .legend{display:grid;gap:8px}
  #citation-points{margin-top:52px}
}

@media print{
  @page{size:A4;margin:12mm}
  @page wide{size:A4 landscape;margin:12mm}
  body.is-folder .page{page:wide}
  .views,.card,.miss,.no-print{display:none!important}
  #citation-points{margin-top:22px}
  .strip{margin-top:10px;padding:8px 0;font-size:10px;border-top:1px solid var(--line)}
  .todo{margin-top:12px;font-size:10px}
  .todo a{text-decoration:none}
  .print-only{display:block}
  .legend{margin-top:10px;font-size:9.5px;gap:6px 18px}
  .chip{height:16px;padding:0 5px;font-size:9px}
  .pt{width:100%;margin-top:12px;border-collapse:collapse;font-size:9.5px;line-height:1.3}
  .pt th{text-align:left;font-size:8.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px 0;border-bottom:1px solid var(--line-strong);vertical-align:bottom}
  .pt td{padding:3.5px 8px 3.5px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .pt tr{break-inside:avoid}
  .pt .grp td{padding-top:7px;font:600 9px var(--mono);color:var(--muted);border-bottom:1px solid var(--line-strong)}
  .pt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pt .sha{padding-left:18px}
  .pt .f b{font-weight:600}
  .pt .k{white-space:nowrap}
  .pt .f{min-width:16ch;overflow-wrap:anywhere}
  .pt code,.foot-note code{font-size:8.5px}
  .foot-note{margin-top:14px;font-size:9px;break-before:avoid}
}
</style>
<noscript><style>.view[hidden]{display:block}</style></noscript>
</head>
<body>
<div class="page">
  <header>
    <p class="kicker">Original data received</p>
    <h1>{{title}}</h1>
    <p class="lede">{{lede}}</p>
    <div class="views" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-overview" aria-controls="overview" aria-selected="true">Overview</button>
      <button type="button" role="tab" id="tab-folder-view" aria-controls="folder-view" aria-selected="false" tabindex="-1">Folder view</button>
    </div>
  </header>

  <main>
    <div class="view" id="overview" role="tabpanel" aria-labelledby="tab-overview">
      {{overview}}
    </div>

    <div class="view" id="folder-view" role="tabpanel" aria-labelledby="tab-folder-view" data-element="folder-view" hidden>
      <div class="strip" id="strip" aria-label="Summary"></div>
      <p class="todo" id="todo" hidden></p>
      <p class="miss" id="miss" role="status" hidden></p>
      <div class="card" id="card">
        <div class="toolbar">
          <div class="seg-wrap">
            <span class="seg-label" id="gb">Group by</span>
            <div class="seg" role="radiogroup" aria-labelledby="gb">
              <label><input type="radio" name="group" value="folder" checked><span>Folder</span></label>
              <label><input type="radio" name="group" value="kind"><span>Kind</span></label>
              <label><input type="radio" name="group" value="week"><span>Received date</span></label>
            </div>
          </div>
          <div class="search"><label for="q" class="vh">Search files</label><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 L14 14"/></svg><input id="q" type="search" placeholder="Search files" autocomplete="off" spellcheck="false"><button type="button" class="clr" id="clr" aria-label="Clear search" title="Clear search" hidden><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button></div>
          <div class="tools">
            <button type="button" class="ibtn" id="expand" aria-label="Expand all" title="Expand all"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3.2 8 6.7l3.5-3.5M4.5 9.3 8 12.8l3.5-3.5"/></svg></button>
            <button type="button" class="ibtn" id="collapse" aria-label="Collapse all" title="Collapse all"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.7 8 3.2l3.5 3.5M4.5 12.8 8 9.3l3.5 3.5"/></svg></button>
          </div>
        </div>
        <table class="tbl" id="tbl" aria-label="Files in inputs/">
          <colgroup><col><col class="k"><col class="s"><col class="rc"><col class="z"><col class="d"><col class="u"></colgroup>
          <thead><tr><th scope="col">Name</th><th scope="col">Kind</th><th scope="col">Status</th><th scope="col">Record</th><th scope="col" class="r">Size</th><th scope="col" class="r">Received</th><th scope="col" class="r">Used by</th></tr></thead>
          <tbody id="tb">{{rows}}</tbody>
        </table>
        <ul class="flat" id="flat" aria-label="Files"></ul>
        <div class="empty" id="empty" hidden></div>
        <div class="card-foot"><span id="count" aria-live="polite"></span><span class="hintk">Click a file for its record</span></div>
      </div>
      <div class="print-only" id="print"></div>
      <div class="legend" id="legend" aria-label="Status legend"></div>
    </div>

    {{points}}
  </main>

  <p class="foot-note" id="footnote"></p>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script type="application/json" id="data">{{data}}</script>

<script>
{{js}}
</script>
<script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('data').textContent);

/* ---------- helpers ---------- */
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ymd(s){return s.split('-').map(Number)}
function utc(s){var a=ymd(s);return Date.UTC(a[0],a[1]-1,a[2])}
function iso(t){var d=new Date(t);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return '—';var a=ymd(s);return a[2]+' '+MON[a[1]-1]+' '+a[0]}
function fmtRange(a,b){
  if(a===b)return fmtDate(a);
  var x=ymd(a),y=ymd(b);
  if(x[0]===y[0]&&x[1]===y[1])return x[2]+'–'+y[2]+' '+MON[y[1]-1]+' '+y[0];
  if(x[0]===y[0])return x[2]+' '+MON[x[1]-1]+' – '+y[2]+' '+MON[y[1]-1]+' '+y[0];
  return fmtDate(a)+' – '+fmtDate(b);
}
function fmtSize(b){
  if(b==null)return '—';
  if(b<1000)return b+' B';
  if(b<1e6){var k=b/1000;return (k<10?k.toFixed(1):String(Math.round(k)))+' KB'}
  var m=b/1e6;return (m<10?m.toFixed(1):String(Math.round(m)))+' MB';
}
function plural(n,w){return n+' '+(n===1?w:w+'s')}
function short(h){return h?h.slice(0,8):''}
function cmp(a,b){return a.localeCompare(b,undefined,{sensitivity:'base',numeric:true})}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
var REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)');

var ICON={
  sheet:'<rect x="2" y="2.8" width="12" height="10.4" rx="1.2"/><path d="M2 6.2 H14 M2 9.8 H14 M6.2 6.2 V13.2 M10 6.2 V13.2"/>',
  document:'<path d="M3.8 1.8 H9.6 L12.6 4.9 V14.2 H3.8 z"/><path d="M9.6 1.8 V4.9 H12.6"/><path d="M5.7 8.2 H10.7 M5.7 10.8 H10.7"/>',
  transcript:'<path d="M2.2 3.6c0-.7.5-1.2 1.2-1.2h9.2c.7 0 1.2.5 1.2 1.2v6.1c0 .7-.5 1.2-1.2 1.2H7.3L4.6 13.4v-2.5H3.4c-.7 0-1.2-.5-1.2-1.2z"/><path d="M5 5.5h6M5 7.9h3.8"/>',
  web:'<circle cx="8" cy="8" r="6.1"/><path d="M1.9 8h12.2"/><path d="M8 1.9c1.7 1.6 2.5 3.7 2.5 6.1S9.7 12.5 8 14.1C6.3 12.5 5.5 10.4 5.5 8S6.3 3.5 8 1.9z"/>',
  folder:'<path d="M1.8 5 c0-.7.5-1.2 1.2-1.2 h2.9 l1.4 1.7 h5.7 c.7 0 1.2.5 1.2 1.2 v5.6 c0 .7-.5 1.2-1.2 1.2 H3 c-.7 0-1.2-.5-1.2-1.2 z"/>',
  'folder-open':'<path d="M1.8 11.6V5c0-.7.5-1.2 1.2-1.2h2.9l1.4 1.7h4.5c.7 0 1.2.5 1.2 1.2v.8"/><path d="M1.8 11.6l1.6-3.9c.2-.5.6-.8 1.1-.8h9.3l-1.7 4.6c-.2.5-.6.8-1.1.8H3c-.7 0-1.2-.5-1.2-.7z"/>',
  archive:'<path d="M2.6 5.6h10.8v7.6H2.6z"/><path d="M1.8 2.8h12.4v2.8H1.8z"/><path d="M6.4 8.2h3.2"/>',
  calendar:'<rect x="2" y="3.2" width="12" height="10.6" rx="1.2"/><path d="M2 6.6h12M5.2 1.8v2.6M10.8 1.8v2.6"/>',

function ic(name,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 16 16" aria-hidden="true" focusable="false">'+(ICON[name]||ICON.document)+'</svg>'}

var KIND={};D.kinds.forEach(function(k){KIND[k.id]=k});
var OTHER={id:null,label:'Unknown format'},ARCHIVE={id:'archive',label:'Archive'};
/* a container (convertWith unpack) is no kind: it is unpacked, never converted */

var SECTION={};D.sections.forEach(function(s){SECTION[s.id]=s});
var STATUS={

  'not-converted':{label:'Not converted',say:'not converted',legend:'no record yet; run convert.js'},

var ORDER=['converted','unchecked','not-converted','duplicate','error'];

/* a row is an input (file: inputs/...), or a record that names no file inside inputs/ (file: null), which is

var FILES=D.files.map(function(f){

  o.cites=f.usedBy.reduce(function(s,u){return s+u.citations},0);
  o.hay=[o.name,f.file,f.recordFile,r&&r.id,r&&r.title,r&&r.detail,kindOf(f).label,STATUS[f.status].label].filter(Boolean).join(' ').toLowerCase();
  return o;
});
var BYFILE={},BYID={},BYANCHOR={};
FILES.forEach(function(f){BYFILE[f.key]=f;BYANCHOR[f.anchor]=f;if(f.rid&&!BYID[f.rid])BYID[f.rid]=f});
var TOTAL_BYTES=FILES.reduce(function(s,f){return s+(f.bytes||0)},0);

function chip(f){return '<span class="chip '+f.status+'">'+STATUS[f.status].label+'</span>'}
function ridLink(id){return '<a class="rid" href="#'+esc(id)+'" data-tip="r|'+esc(id)+'">'+esc(id)+'</a>'}
function usedTitle(f){return f.usedBy.map(function(u){return (SECTION[u.section]||{label:u.section}).label+' '+u.name+': '+u.citations}).join(' · ')}
function usedHTML(f){
  return f.cites?'<span class="used" title="'+esc(usedTitle(f))+'"><b>'+f.cites+'</b> '+(f.cites===1?'citation':'citations')+'</span>':'<span class="m">Not cited</span>';

function weekStart(s){var t=utc(s),d=new Date(t).getUTCDay();return iso(t-((d+6)%7)*864e5)}
/* a file with no record of its own has no received date: its group comes last */
function weekOf(f){return f.captured?weekStart(f.captured):'none'}
function weekLabel(s){var a=weekStart(s);return fmtRange(a,iso(utc(a)+6*864e5))}

/* ---------- the two views ---------- */
var TABS={overview:document.getElementById('tab-overview'),folder:document.getElementById('tab-folder-view')};
var PANES={overview:document.getElementById('overview'),folder:document.getElementById('folder-view')};
var view='overview';
function showView(v){
  if(v===view)return;

  ['overview','folder'].forEach(function(k){
    var on=k===v;PANES[k].hidden=!on;TABS[k].setAttribute('aria-selected',String(on));TABS[k].tabIndex=on?0:-1;
  });

}
function viewOf(el){return PANES.folder.contains(el)?'folder':PANES.overview.contains(el)?'overview':null}
Object.keys(TABS).forEach(function(k){TABS[k].addEventListener('click',function(){showView(k)})});
document.querySelector('.views').addEventListener('keydown',function(e){
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'&&e.key!=='Home'&&e.key!=='End')return;
  e.preventDefault();var k=view==='overview'?'folder':'overview';showView(k);TABS[k].focus();
});

/* ---------- state ---------- */
var S={group:'folder',q:'',closed:{},open:null};
var mq=window.matchMedia('screen and (max-width: 900px)');
function phone(){return mq.matches}
var $tb=document.getElementById('tb'),$flat=document.getElementById('flat'),$empty=document.getElementById('empty'),
    $count=document.getElementById('count'),$q=document.getElementById('q'),$clr=document.getElementById('clr'),
    $miss=document.getElementById('miss');

function matches(f){return !S.q||f.hay.indexOf(S.q.toLowerCase())>=0}
function why(f){
  if(!S.q)return '';
  var q=S.q.toLowerCase(),r=f.record;
  if(f.name.toLowerCase().indexOf(q)>=0)return '';
  var fields=[['path',f.file],['record file',f.recordFile],['record id',r&&r.id],['title',r&&r.title],['detail',r&&r.detail],['kind',kindOf(f).label],['status',STATUS[f.status].label]];
  for(var i=0;i<fields.length;i++)if(fields[i][1]&&fields[i][1].toLowerCase().indexOf(q)>=0)return 'in '+fields[i][0];
  return '';
}
function hl(t){
  if(!S.q)return esc(t);
  var i=t.toLowerCase().indexOf(S.q.toLowerCase());
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+S.q.length))+'</mark>'+esc(t.slice(i+S.q.length));
}
function hintFor(f){
  var w=why(f);
  if(w)return '<span class="hint">'+esc(w)+'</span>';
  if(!f.file)return '<span class="hint">record only</span>';
  if(S.group!=='folder'&&f.folder!=='inputs')return '<span class="hint">'+esc(f.folder.slice(7))+'/</span>';
  return '';
}

/* ---------- model ---------- */
function leaf(f){return {key:'f:'+f.file,type:'file',file:f}}
function folderTree(fs,keepEmpty){
  var map={};
  function ensure(p){
    if(map[p])return map[p];
    var i=p.lastIndexOf('/');
    var n=map[p]={key:'d:'+p,type:'folder',name:p.slice(i+1),path:p,children:[]};
    if(i>0)ensure(p.slice(0,i)).children.push(n);
    return n;
  }
  ensure('inputs');
  if(keepEmpty)D.folders.forEach(ensure);
  fs.forEach(function(f){ensure(f.folder).children.push(leaf(f))});
  (function sort(n){
    n.children.sort(function(a,b){return (a.type==='file')-(b.type==='file')||cmp(a.type==='file'?a.file.name:a.name,b.type==='file'?b.file.name:b.name)});
    n.children.forEach(function(c){if(c.children)sort(c)});
  })(map.inputs);
  return fs.length||keepEmpty?[map.inputs]:[];
}
function roots(){
  var fs=FILES.filter(matches);
  if(S.group==='folder')return folderTree(fs,!S.q);
  var byName=function(a,b){return cmp(a.name,b.name)};
  if(S.group==='kind'){
    return D.kinds.concat([ARCHIVE,OTHER]).filter(function(k){return fs.some(function(f){return kindOf(f)===k})}).map(function(k){
      return {key:'k:'+k.id,type:'group',name:k.label,icon:k.id||'document',children:fs.filter(function(f){return kindOf(f)===k}).sort(byName).map(leaf)};
    });
  }
  var weeks=[];fs.forEach(function(f){var w=weekOf(f);if(weeks.indexOf(w)<0)weeks.push(w)});
  weeks.sort(function(a,b){return (a==='none')-(b==='none')||(a<b?-1:a>b?1:0)});
  return weeks.map(function(w){
    return {key:'w:'+w,type:'group',name:w==='none'?'No record yet':weekLabel(w),icon:'calendar',children:fs.filter(function(f){return weekOf(f)===w}).sort(function(a,b){return a.captured<b.captured?-1:a.captured>b.captured?1:cmp(a.name,b.name)}).map(leaf)};
  });
}
function filesIn(n){return n.type==='file'?[n.file]:n.children.reduce(function(a,c){return a.concat(filesIn(c))},[])}
function dirKeys(ns,out){ns.forEach(function(n){if(n.type!=='file'){out.push(n.key);dirKeys(n.children,out)}});return out}
function isOpen(n){return !S.closed[n.key]}
function groupKeyOf(f){return S.group==='kind'?'k:'+kindOf(f).id:'w:'+weekOf(f)}

/* ---------- table (desktop) ---------- */
function dirRow(n,lvl){
  var open=isOpen(n),fs=filesIn(n),icon=n.type==='folder'?(open?'folder-open':'folder'):n.icon;
  var h='<tr class="dir" data-key="'+esc(n.key)+'"><td colspan="7"><div class="nmw" style="--lvl:'+lvl+'">'+
    '<button type="button" class="nb" data-key="'+esc(n.key)+'" aria-expanded="'+open+'" aria-label="'+esc(n.name+(n.type==='folder'?', folder':'')+', '+plural(fs.length,'file'))+'">'+
    '<span class="chev">'+ic('chev')+'</span>'+ic(icon)+'<span class="fv-nm">'+esc(n.name)+'</span></button><span class="cnt" aria-hidden="true">'+fs.length+'</span></div></td></tr>';
  if(open)n.children.forEach(function(c){h+=c.type==='file'?fileRow(c.file,lvl+1):dirRow(c,lvl+1)});
  return h;
}
function fileRow(f,lvl){
  var open=S.open===f.key,pk='pk-'+f.anchor.slice(5),k=kindOf(f);
  var h='<tr class="file'+(open?' open':'')+'"'+(f.rid&&BYID[f.rid]===f?' id="'+esc(f.rid)+'"':'')+' data-path="'+esc(f.key)+'">'+
    '<td id="'+f.anchor+'"><div class="nmw" style="--lvl:'+lvl+'"><button type="button" class="nb" data-path="'+esc(f.key)+'" aria-expanded="'+open+'"'+(open?' aria-controls="'+pk+'"':'')+'>'+
      '<span class="chev">'+ic('chev')+'</span>'+ic(k.id)+'<span class="fv-nm">'+hl(f.name)+'</span></button>'+hintFor(f)+'</div></td>'+
    '<td class="kd"'+(f.kindFrom==='extension'?' title="From the '+esc(f.ext)+' extension"':'')+'>'+esc(k.label)+'</td>'+
    '<td>'+chip(f)+'</td>'+
    '<td>'+(f.rid?ridLink(f.rid):'<span class="m">—</span>')+'</td>'+
    '<td class="r num">'+fmtSize(f.bytes)+'</td>'+
    '<td class="r num"'+(f.captured?'':' title="'+esc(noDate(f))+'"')+'>'+fmtDate(f.captured)+'</td>'+
    '<td class="r num">'+usedHTML(f)+'</td></tr>';
  if(open)h+='<tr class="peek" id="'+pk+'"><td colspan="3"><div class="pk" style="--lvl:'+lvl+'">'+peekLeft(f)+'</div></td><td colspan="4"><div class="pk-r">'+peekRight(f)+'</div></td></tr>';
  return h;
}
/* why a file has no received date: the Received cell's title */
function noDate(f){
  if(f.status==='duplicate')return 'A copy has no record of its own';
  if(f.convertWith==='unpack')return 'A container has no record: unpack it first';
  if(f.status==='not-converted')return 'Its record’s captured date, once it is converted';
  return 'Its record has no valid captured date';
}
function recName(f){return f.rid?ridLink(f.rid):'<code>'+esc(f.recordFile||'')+'</code>'}
function unitsText(r){return (r.units||[]).map(function(u){return plural(u.n,u.of)}).join(' · ')}
function peekLeft(f){
  var r=f.record;
  if(f.status==='duplicate'){
    var o=f.duplicateOf.file&&BYFILE[f.duplicateOf.file];
    return 'Same bytes as '+(o?'<a href="#'+o.anchor+'">'+esc(o.name)+'</a>':'the input of '+ridLink(f.duplicateOf.id))+' · cite '+ridLink(f.duplicateOf.id)+' instead';
  }
  if(f.convertWith==='unpack')return 'A container · unpack it first, into <code>inputs/'+esc(f.name.slice(0,f.name.length-f.ext.length))+'/</code>';
  if(f.status==='not-converted')return 'No record yet · convert it with <code>convert.js</code>'+(f.convertWith==='bs.py'?'':', which hands '+esc(f.ext||'these')+' files to the converter agent');
  if(f.status==='error'){
    var id=recName(f);
    return f.problem==='missing'?'The input is missing · restore it'
      :f.problem==='edited'?'The file no longer matches '+id+' · restore the original'
      :f.problem==='kind'?'A '+esc(kindOf(f).label.toLowerCase())+' record cannot come from a '+esc(f.ext||'extensionless')+' file · convert it again'
      :f.problem==='outside'?id+' names no file inside <code>inputs/</code> · <code>bs.py check</code> names the fix'
      :f.problem==='named-twice'?id+' names a file another record already names · <code>bs.py check</code> names the fix'
      :f.problem==='unreadable'?'<code>'+esc(f.recordFile)+'</code> is not a record file · <code>bs.py check</code> names the fix'
      :id+'’s record file is invalid · <code>bs.py check</code> names the fix';
  }
  /* the record's header only: its verbatim lines are printed where a page cites them, in Citation points */
  return [r.title?'<b>'+esc(r.title)+'</b>':'',esc(r.detail||r.url||''),esc(unitsText(r))].filter(Boolean).join(' · ');
}
function peekRight(f){
  var r=f.record,was=r&&r.sha256?'<code>'+esc(short(r.sha256))+'</code>':'',h='<span class="lbl">sha256</span>';
  if(!f.sha256){
    if(f.status!=='error')return '<span>File unreadable</span>';
    return '<span>'+(f.file?'File missing':'No file')+'</span>'+(was?'<span> · recorded </span>'+h+was:'');
  }
  h+='<code>'+esc(short(f.sha256))+'</code>';
  if(f.status==='duplicate')return h+'<span> · same bytes</span>';
  if(!r)return h+'<span> · no record to compare</span>';
  if(f.status==='error')return h+'<span> · '+(f.problem==='edited'&&was?'recorded '+was:'see the line on the left')+'</span>';
  return h+ic('check')+'<span>matches '+esc(r.id)+(r.coverage==='partial'?' · partial excerpt':'')+(f.status==='unchecked'?' · not compared yet':'')+'</span>';
}

/* ---------- flat list (phone) ---------- */
function flatGroups(){
  var fs=FILES.filter(matches);
  if(S.group==='folder'){
    var out=[];
    (function walk(n){
      n.children.filter(function(c){return c.type!=='file'}).forEach(walk);
      var own=n.children.filter(function(c){return c.type==='file'});
      if(own.length)out.push({label:n.path+'/',icon:'folder',files:own.map(function(c){return c.file})});
    })(folderTree(fs,false)[0]||{children:[]});
    return out;
  }
  return roots().map(function(g){return {label:g.name,icon:g.icon,files:g.children.map(function(c){return c.file})}});
}
function flatItem(f){
  var rec=f.rid?ridLink(f.rid):f.status==='duplicate'?'<span>same as '+ridLink(f.duplicateOf.id)+'</span>':'',w=why(f)||(f.file?'':'record only');
  return '<li class="fi"'+(f.rid&&BYID[f.rid]===f?' id="'+esc(f.rid)+'"':'')+'><div class="fi-nm" id="'+f.anchor+'">'+ic(kindOf(f).id)+'<span>'+hl(f.name)+(w?' <span class="hint">'+esc(w)+'</span>':'')+'</span></div>'+
    '<div class="fi-meta">'+chip(f)+rec+(f.bytes!=null?'<span>'+fmtSize(f.bytes)+'</span>':'')+(f.captured?'<span>'+fmtDate(f.captured)+'</span>':'')+usedHTML(f)+'</div></li>';
}

/* ---------- render: only the visible view holds rows, so every row id is unique ---------- */
function render(){
  if(window.BS_HIDE_TIP)window.BS_HIDE_TIP();
  if(view!=='folder'){$flat.innerHTML='';return}   /* the static rows stay, so every #RECORD-ID lands */
  var n=0;
  if(phone()){
    $tb.innerHTML='';
    var gs=flatGroups();n=gs.length;
    $flat.innerHTML=gs.map(function(g){
      return '<li><h3 class="fg-h">'+ic(g.icon)+'<span>'+esc(g.label)+'</span><span class="n">'+g.files.length+'</span></h3><ul>'+g.files.map(flatItem).join('')+'</ul></li>';
    }).join('');
  }else{
    $flat.innerHTML='';
    var rs=roots();n=rs.length;
    $tb.innerHTML=rs.map(function(r){return dirRow(r,0)}).join('');
  }
  $empty.hidden=n>0;
  $empty.innerHTML=n?'':'No files match “'+esc(S.q)+'”.<button type="button" data-act="clear">Clear search</button>';
  var m=FILES.filter(matches).length;
  $count.textContent=S.q?m+' of '+plural(FILES.length,'file')+' match':plural(FILES.length,'file')+' · '+fmtSize(TOTAL_BYTES);
}
function focusBtn(attr,val){
  var b=$tb.querySelector('.nb['+attr+'="'+CSS.escape(val)+'"]');if(b)b.focus({preventScroll:true});
}

/* render() rebuilds the rows. Focus goes back to the row's button only after a keyboard
   activation (detail 0) or when a keyboard user's focus ring was already in the table;
   a mouse click leaves focus alone, so no ring appears on it. */
function keyboardFocus(e){
  var a=document.activeElement;
  return e.detail===0||!!(a&&$tb.contains(a)&&a.matches(':focus-visible'));
}
$tb.addEventListener('click',function(e){
  if(e.target.closest('a'))return;
  var tr=e.target.closest('tr.dir,tr.file');if(!tr)return;
  var kb=keyboardFocus(e);
  if(tr.classList.contains('dir')){
    var key=tr.getAttribute('data-key');
    if(S.closed[key])delete S.closed[key];else S.closed[key]=true;
    render();if(kb)focusBtn('data-key',key);return;
  }
  var p=tr.getAttribute('data-path');
  S.open=S.open===p?null:p;
  render();if(kb)focusBtn('data-path',p);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.open&&e.target!==$q&&view==='folder'){var p=S.open;S.open=null;render();focusBtn('data-path',p)}
});

/* ---------- landing: #RECORD-ID or #file-<slug> opens the Folder view at that row ---------- */
function fileForHash(h){
  h=(h||'').replace(/^#/,'');if(!h)return null;
  try{h=decodeURIComponent(h)}catch(_){}
  if(BYID[h])return BYID[h];
  if(BYANCHOR[h])return BYANCHOR[h];
  var u=h.toUpperCase();if(BYID[u])return BYID[u];
  var l=h.toLowerCase();return BYANCHOR[l]||null;
}
function expandTo(f){
  if(!matches(f)){S.q='';$q.value='';$clr.hidden=true}
  if(S.group==='folder'){var p=f.folder;while(p){delete S.closed['d:'+p];var i=p.lastIndexOf('/');p=i>0?p.slice(0,i):''}}
  else delete S.closed[groupKeyOf(f)];
}
function rowEl(f){var a=document.getElementById(f.anchor);return a?a.closest('tr,.fi'):null}
function flash(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('flash')},2700)}
function land(fs,smooth,focus){
  showView('folder');
  fs.forEach(expandTo);render();
  var els=fs.map(rowEl).filter(Boolean);if(!els.length)return;
  els.sort(function(a,b){return a.getBoundingClientRect().top-b.getBoundingClientRect().top});
  els[0].scrollIntoView({block:'center',behavior:smooth&&!REDUCED.matches?'smooth':'auto'});
  els.forEach(flash);
  if(focus){var b=els[0].querySelector('.nb,a.rid');if(b)b.focus({preventScroll:true})}
}
function hashText(h){h=(h||'').replace(/^#/,'');try{return decodeURIComponent(h)}catch(_){return h}}
function landHash(smooth){
  var h=location.hash,f=fileForHash(h),t=hashText(h),el=t&&document.getElementById(t);
  /* the notice is for a stale citation only: a hash that names no file, no record and no element on the page */
  $miss.hidden=!(t&&!f&&!el);
  if(!$miss.hidden){$miss.textContent='No file or record “'+t+'” in this workspace.';showView('folder');return}
  if(f){land([f],smooth,false);return}
  if(el){
    var v=t==='folder-view'?'folder':t==='overview'?'overview':viewOf(el);
    if(v)showView(v);
    if(v||el.closest('#citation-points'))el.scrollIntoView({block:el.tagName==='LI'||el.tagName==='TR'?'center':'start',behavior:smooth&&!REDUCED.matches?'smooth':'auto'});
  }
}
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href^="#"]');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey)return;
  var h=a.getAttribute('href'),st=a.getAttribute('data-st');
  if(st){
    e.preventDefault();
    land(FILES.filter(function(f){return f.status===st}),true,e.detail===0);return;
  }
  var f=fileForHash(h);
  if(!f){
    /* an element of the other view: show its view first, then the browser moves to it */
    var el=document.getElementById(hashText(h)),v=el&&viewOf(el);
    if(v)showView(v);
    return;
  }
  e.preventDefault();$miss.hidden=true;
  /* the entry left behind remembers its view, so Back returns to it */
  if(location.hash!==h){history.replaceState({view:view},'');history.pushState({view:'folder'},'',h)}
  land([f],true,e.detail===0);
});
window.addEventListener('hashchange',function(){landHash(true)});
/* Back and Forward: the view the entry remembers, else the Overview for an empty hash; landHash then follows a
   hash that names a file or an element of either view */
window.addEventListener('popstate',function(e){
  var v=e.state&&e.state.view;
  if(v)showView(v);else if(!location.hash)showView('overview');
  landHash(false);
});

/* ---------- tooltip of a record id: its header and file ---------- */
window.BS_TIP=function(key){
  var p=(key||'').split('|');if(p[0]!=='r')return '';
  var f=BYID[p[1]];if(!f||!f.record)return '';
  var r=f.record;
  var meta=[r.kind?kindOf(r).label:'',r.captured?'captured '+fmtDate(r.captured):'',r.coverage==='partial'?'partial: a Gap search over it is provisional':r.coverage||''].filter(Boolean).join(' · ');
  return '<p class="tp-h">'+esc(r.id)+(r.title?' · '+esc(r.title):'')+'</p>'+(r.detail?'<p>'+esc(r.detail)+'</p>':'')+(r.url?'<p class="mono">'+esc(r.url)+'</p>':'')+
    (meta?'<p class="tp-m">'+esc(meta)+'</p>':'')+'<p class="tp-f">'+esc(f.file||f.recordFile)+'</p>';
};

/* ---------- strip, notice, legend, print ---------- */
function count(st){return FILES.filter(function(f){return f.status===st}).length}
function sayN(st,n){return st==='error'?(n===1?'error':'errors'):STATUS[st].say}
function renderHeader(){
  var kinds=D.kinds.map(function(k){return {k:k,n:FILES.filter(function(f){return f.kind===k.id}).length}}).filter(function(x){return x.n});
  var groups=[
    '<span class="si"><b>'+FILES.length+'</b> '+(FILES.length===1?'file':'files')+'</span><span class="si"><b>'+fmtSize(TOTAL_BYTES)+'</b> in total</span>',
    kinds.map(function(x){return '<span class="si">'+ic(x.k.id)+esc(x.k.label)+' <b>'+x.n+'</b></span>'}).join(''),
    ORDER.filter(count).map(function(st){return '<span class="si"><i class="mk '+st+'"></i><b>'+count(st)+'</b> '+sayN(st,count(st))+'</span>'}).join('')
  ].filter(Boolean);
  document.getElementById('strip').innerHTML='<div class="strip-i">'+groups.map(function(g){return '<div class="sg">'+g+'</div>'}).join('')+'</div>';
  var present=ORDER.filter(function(st){return st!=='error'||count(st)});
  document.getElementById('legend').innerHTML=present.map(function(st){return '<span class="lg"><span class="chip '+st+'">'+STATUS[st].label+'</span>'+esc(STATUS[st].legend)+'</span>'}).join('');
  var ex=FILES.filter(function(f){return f.rid&&BYID[f.rid]===f}).map(function(f){return f.rid}).sort(cmp)[0];
  document.getElementById('footnote').innerHTML='Computed from '+esc(D.workspace.path)+': its inputs, records, section files and inventory; never authored. '+
    'Received is a record’s captured date, so a file has none until it is converted.'+
    (ex?' Citations on the other pages land on the Folder view’s rows, for example <code>data-received.html#'+esc(ex)+'</code>.':'');
}
function renderTodo(){
  var items=[
    ['not-converted',function(n){return plural(n,'file')+' not converted'}],
    ['unchecked',function(n){return n+' to compare'}],
    ['duplicate',function(n){return plural(n,'duplicate')}],
    ['error',function(n){return n+' to fix'}]
  ].filter(function(x){return count(x[0])}).map(function(x){
    var fs=FILES.filter(function(f){return f.status===x[0]}).sort(function(a,b){return cmp(a.key,b.key)});
    return '<a href="#'+fs[0].anchor+'" data-st="'+x[0]+'" title="'+esc(fs.map(function(f){return f.name}).join(', '))+'">'+esc(x[1](fs.length))+'</a>';
  });
  var el=document.getElementById('todo');
  el.hidden=!items.length;
  el.innerHTML=items.length?'<span class="todo-h">To do</span><span class="todo-w"><span class="todo-i">'+items.map(function(a){return '<span class="ti">'+a+'</span>'}).join('')+'</span></span>':'';
}
function renderPrint(){
  /* the screen's folder order: subfolders first, then a folder's own files, so inputs/ (the root files) comes last */
  var rows='',groups=[];
  (function walk(n){
    n.children.filter(function(c){return c.type!=='file'}).forEach(walk);
    var own=n.children.filter(function(c){return c.type==='file'});
    if(own.length)groups.push({label:n.path+'/',files:own.map(function(c){return c.file})});
  })(folderTree(FILES,false)[0]||{children:[]});
  groups.forEach(function(g){
    rows+='<tr class="grp"><td colspan="9">'+esc(g.label)+'</td></tr>';
    g.files.forEach(function(f){
      var r=f.record,used=f.usedBy.map(function(u){return esc((SECTION[u.section]||{label:u.section}).label)+' '+u.citations}).join(', '),u=r?unitsText(r):'';
      rows+='<tr><td class="f"><b>'+esc(f.name)+'</b>'+(f.file?'':' <span class="m">record only</span>')+'</td><td class="k">'+esc(kindOf(f).label)+'</td><td>'+chip(f)+'</td>'+
        '<td>'+(r&&r.id?esc(r.id)+(r.coverage==='partial'?' <span class="m">partial</span>':'')+(u?'<br><span class="m">'+esc(u)+'</span>':''):f.status==='duplicate'?'<span class="m">same as '+esc(f.duplicateOf.id)+'</span>':'<span class="m">—</span>')+'</td>'+
        '<td>'+(r&&r.detail?esc(r.detail):r&&r.url?esc(r.url):'<span class="m">—</span>')+'</td>'+
        '<td class="num">'+fmtSize(f.bytes)+'</td><td class="num">'+fmtDate(f.captured)+'</td>'+
        '<td class="sha">'+(f.sha256?'<code>'+esc(short(f.sha256))+'</code>':'<span class="m">—</span>')+'</td><td>'+(used||'<span class="m">Not cited</span>')+'</td></tr>';
    });
  });
  document.getElementById('print').innerHTML='<table class="pt"><thead><tr><th>File</th><th>Kind</th><th>Status</th><th>Record</th><th>Detail</th><th class="num">Size</th><th class="num">Received</th><th class="sha">sha256</th><th>Used by</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

/* ---------- controls ---------- */
Array.prototype.forEach.call(document.querySelectorAll('input[name=group]'),function(r){
  r.addEventListener('change',function(){if(!r.checked)return;S.group=r.value;render()});
});
function setQuery(v){$q.value=v;S.q=v.trim();$clr.hidden=!v;S.closed={};if(S.open&&!matches(BYFILE[S.open]))S.open=null;render()}
$q.addEventListener('input',function(){setQuery($q.value)});
$clr.addEventListener('click',function(){setQuery('');$q.focus()});
$q.addEventListener('keydown',function(e){if(e.key==='Escape'&&$q.value){e.preventDefault();setQuery('')}});
document.getElementById('expand').addEventListener('click',function(){S.closed={};render()});
document.getElementById('collapse').addEventListener('click',function(){
  var ks=dirKeys(roots(),[]);S.closed={};ks.forEach(function(k){if(k!=='d:inputs')S.closed[k]=true});
  S.open=null;render();
});
$empty.addEventListener('click',function(e){if(e.target.closest('[data-act=clear]')){setQuery('');$q.focus()}});
if(mq.addEventListener)mq.addEventListener('change',render);else mq.addListener(render);

renderHeader();renderTodo();renderPrint();
if(location.hash){
  landHash(false);
  window.addEventListener('load',function(){var f=fileForHash(location.hash),el=f&&rowEl(f);if(el)el.scrollIntoView({block:'center'})});
}
})();
</script>
</body>
</html>
