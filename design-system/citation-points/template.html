<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{title}}</title>
<style>
/* Citation points: the map tokens and the look of Original data received (design-system/data-received/overview.css) */
:root{
  --bg:#faf9f6;--paper:#fff;--panel:#f3efe7;--lane-alt:#ece8e0;
  --ink:#111;--muted:#626260;--line:#dedbd6;--line-strong:#c8c8c4;--flow:#454542;
  --accent:#ff5600;--accent-ink:#b84000;
  --radius:2px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  /* one grid for every row: address | verbatim records | used by */
  --c1:260px;--c4:300px;--cg:24px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
code{font-family:var(--mono);font-size:12px}
q{quotes:"\201C" "\201D" "\2018" "\2019"}
.mut{color:var(--muted)}
[hidden]{display:none!important}

.page{max-width:1280px;margin:0 auto;padding:48px 40px 64px}
.kicker{margin:0;color:var(--accent-ink);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
h1{margin:10px 0 8px;font-size:32px;line-height:1.12;font-weight:600;letter-spacing:-.01em}
.lede{margin:0;color:var(--muted);font-size:15px;max-width:90ch;font-variant-numeric:tabular-nums}

/* on this page: one row of record files, each with its point count */
.toc{display:grid;grid-template-columns:var(--c1) minmax(0,1fr);column-gap:var(--cg);align-items:baseline;margin-top:28px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13.5px}
.toc-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toc-l{display:flex;flex-wrap:wrap;gap:8px 32px;margin:0;padding:0;list-style:none}
.toc a{display:inline-flex;gap:8px;align-items:baseline;text-decoration:none;white-space:nowrap}
.toc-t{font:600 12.5px var(--mono)}
.toc a:hover .toc-t{text-decoration:underline;text-decoration-color:var(--ink);text-underline-offset:3px}
.toc-c{color:var(--muted);font-variant-numeric:tabular-nums}

/* the filter and the unused-records switch: shown once the script runs */
.bar{display:grid;grid-template-columns:var(--c1) minmax(0,1fr) auto;column-gap:var(--cg);align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.srch{position:relative;display:block}
.srch svg{position:absolute;left:9px;top:50%;width:14px;height:14px;margin-top:-7px;fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;pointer-events:none}
.srch input{width:100%;height:30px;padding:0 10px 0 29px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper);font-size:13px}
.srch input::placeholder{color:var(--muted)}
.srch input:focus-visible{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.tg{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--flow);cursor:pointer;justify-self:start}
.tg input{width:14px;height:14px;margin:0;accent-color:var(--ink);cursor:pointer}
.bar-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* one record file: its header, its points, and (switched) its records nobody cites */
.grp{margin-top:52px}
.grp:first-of-type{margin-top:36px}
.gh{display:grid;grid-template-columns:var(--c1) minmax(0,1fr) var(--c4);column-gap:var(--cg);align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--line-strong)}
.gh-id{margin:0;font:600 15px/1.4 var(--mono)}
.gh-id a:hover{text-decoration-color:var(--ink)}
.gh-id.warn{color:var(--accent-ink)}
.gh-t{min-width:0;font-size:14px}
.gh-t b{font-weight:600}
.gh-m{margin-left:10px;font-size:12.5px;color:var(--muted)}
.gh-d{display:block;margin-top:1px;font-size:12.5px;color:var(--muted)}
.gh-n{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.pts,.urs{list-style:none;margin:0;padding:0}
.urs{display:none}
.only-unused .pts{display:none}
.only-unused .urs{display:block}
.pts>li,.urs>li{display:grid;grid-template-columns:var(--c1) minmax(0,1fr) var(--c4);column-gap:var(--cg);align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.pts>li.pt-none,.urs>li.pt-none{display:block;color:var(--muted)}
.pt-a{min-width:0}
.loc{font:600 12px/1.6 var(--mono);color:var(--ink);overflow-wrap:anywhere}
.pt-v{min-width:0;overflow-wrap:anywhere}
.vb{margin:0}
.vl{list-style:none;margin:0;padding:0}
.vl li{display:grid;grid-template-columns:minmax(12ch,auto) minmax(0,1fr);column-gap:8px;align-items:baseline}
.vl li+li{margin-top:3px}
.sub{font-size:11.5px;color:var(--muted)}
.ctx{margin-right:8px;font-size:12px;color:var(--muted)}
.ab{color:var(--flow)}
.st{color:var(--muted)}
.miss{margin:0;color:var(--accent-ink);font-size:12.5px}
.more{margin-top:3px}
.more summary{display:inline;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline dotted var(--line-strong);text-underline-offset:3px}
.more summary::-webkit-details-marker{display:none}
.more summary:hover{color:var(--ink)}
.more[open] summary{display:none}

/* used by: one line per kind and page; the kind is said once, the page follows its elements */
.ub{list-style:none;margin:0;padding:0;min-width:0;font-size:12px}
.use{display:grid;grid-template-columns:92px minmax(0,1fr);column-gap:8px}
.use+.use{margin-top:2px}
.k{font-weight:600;color:var(--flow)}
.els{min-width:0;overflow-wrap:anywhere}
.els a{color:var(--ink)}
.els a:not(.pg){white-space:nowrap}
.els a.pg{color:var(--muted);text-decoration:none}
.els a.pg:hover{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink)}

/* landing on a point: the shared 2px accent rule and fade */
@keyframes land-out{0%,40%{background-color:var(--panel);box-shadow:-12px 0 0 var(--panel),-14px 0 0 var(--accent)}100%{background-color:rgba(243,239,231,0);box-shadow:-12px 0 0 rgba(243,239,231,0),-14px 0 0 rgba(255,86,0,0)}}
.pts>li:target{animation:land-out 2.6s ease-out}
@media (prefers-reduced-motion:reduce){.pts>li:target{animation-timing-function:step-end}}

.empty{margin:28px 0 0;color:var(--muted);font-size:13px}
.foot{margin-top:72px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.foot code{color:var(--flow)}

@media (max-width:960px){
  :root{--c1:200px;--c4:240px}
}
@media (max-width:760px){
  .page{padding:28px 16px 48px}
  h1{font-size:26px}
  .lede{font-size:14px}
  .toc,.bar{grid-template-columns:1fr;row-gap:10px}
  .bar-n{justify-self:start}
  .gh,.pts>li,.urs>li{grid-template-columns:1fr;row-gap:5px}
  .gh-n{text-align:left}
  .gh-m{display:block;margin-left:0}
  }
@media print{
  @page{size:A4;margin:14mm 12mm}
  :root{--c1:24%;--c4:30%;--cg:12px}
  body{background:#fff;font-size:10px}
  .page{max-width:none;padding:0}
  h1{font-size:20px}
  .lede{font-size:10.5px}
  .bar,.toc{display:none!important}
  .grp,.grp:first-of-type{margin-top:16px}
  .gh{break-after:avoid;padding-bottom:5px}
  .gh-id{font-size:11px}
  .gh-t{font-size:10.5px}
  .gh-m,.gh-d,.gh-n{font-size:9px}
  .pts>li{padding:5px 0;font-size:9.5px;break-inside:avoid}
  .loc,.sub,.ctx,.ub{font-size:8.5px}
  .use{grid-template-columns:62px minmax(0,1fr)}
  .more summary{text-decoration:none}
  a{text-decoration:none}
  .foot{margin-top:20px;font-size:8.5px}
}
</style>
</head>
<body>
<main class="page">
<p class="kicker">Citation points</p>
<h1>{{title}}</h1>
<p class="lede">{{lede}}</p>
<nav class="toc" aria-label="Record files"><span class="toc-h">On this page</span><ul class="toc-l">{{toc}}</ul></nav>
<div class="bar" id="bar" role="search" hidden>
<label class="srch"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg><input type="search" id="q" placeholder="Filter by address, text or element" aria-label="Filter citation points" autocomplete="off"></label>
<label class="tg"><input type="checkbox" id="unused"> Show only unused records</label>
<span class="bar-n" id="shown" aria-live="polite">{{total}} points</span>
</div>
<p class="empty" id="empty" hidden>Nothing matches the filter.</p>
{{body}}
<p class="foot">{{foot}}</p>
</main>
<script>
(function(){
  'use strict';
  var bar=document.getElementById('bar');
  var q=document.getElementById('q'), un=document.getElementById('unused');
  var shown=document.getElementById('shown'), empty=document.getElementById('empty');
  var groups=[].slice.call(document.querySelectorAll('.grp'));
  var TOTAL={{total}}, UNUSED={{unused}};
  function norm(s){return s.toLowerCase().replace(/\s+/g,' ');}
  [].forEach.call(document.querySelectorAll('.pts>li,.urs>li'),function(r){r._t=norm(r.textContent);});
  function apply(){
    var term=norm(q.value.trim()), u=un.checked, n=0;
    document.body.classList.toggle('only-unused',u);
    groups.forEach(function(g){
      var any=0;
      [].forEach.call(g.querySelectorAll(u?'.urs>li':'.pts>li'),function(r){
        var ok=!term||r._t.indexOf(term)>=0;
        r.hidden=!ok;
        if(ok&&!r.classList.contains('pt-none')){any++;n++;}
      });
      g.hidden=!!(term||u)&&!any;
    });
    var all=u?UNUSED:TOTAL, what=u?(all===1?' unused record':' unused records'):(all===1?' point':' points');
    shown.textContent=(term?n+' of ':'')+all+what;
    empty.hidden=!term||n>0;
  }
  function reveal(){
    var t=location.hash&&document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if(t&&(t.hidden||(t.closest&&t.closest('[hidden]'))||(un.checked&&t.closest&&t.closest('.pts')))){
      q.value='';un.checked=false;apply();t.scrollIntoView();
    }
  }
  q.addEventListener('input',apply);
  un.addEventListener('change',apply);
  window.addEventListener('hashchange',reveal);
  bar.hidden=false;
  apply();
}());
</script>
</body>
</html>
